name: Release Guard
run-name: ${{ github.event_name == 'workflow_run' && 'Публикуй' || (github.event_name == 'issues' && (startsWith(github.event.issue.title, 'Публикуй: ') && 'Публикуй' || 'Проверь')) || inputs.operation }} · Release Guard
on:
  workflow_run:
    workflows: [Quality checks]
    types: [completed]
    branches: [main]
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      operation:
        description: Действие владельца
        required: true
        type: choice
        options:
          - Публикуй
          - Проверь
          - Восстанови
      expected_sha:
        description: Проверенный SHA для автоматического запуска
        required: false
        type: string
permissions:
  contents: read
  actions: read
  pages: read
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.event_name != 'issues' && 'pages-production' || ((github.event_name == 'issues' && github.event.action == 'opened' && github.event.issue.user.login == github.repository_owner && github.event.sender.login == github.repository_owner && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.run_attempt == 1 && github.event.issue.body == 'Release Guard owner command v1' && (startsWith(github.event.issue.title, 'Публикуй: ') || startsWith(github.event.issue.title, 'Проверь: '))) && 'pages-production' || format('ignored-release-request-{0}', github.run_id)) }}
  cancel-in-progress: false
jobs:
  preflight:
    if: >-
      (github.event_name == 'issues' && github.event.action == 'opened' && github.event.issue.user.login == github.repository_owner && github.event.sender.login == github.repository_owner && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.run_attempt == 1 && github.event.issue.body == 'Release Guard owner command v1' && (startsWith(github.event.issue.title, 'Публикуй: ') || startsWith(github.event.issue.title, 'Проверь: '))) || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_sha == github.sha && github.event.workflow_run.run_attempt == 1 && github.event.workflow_run.actor.login == github.repository_owner && github.event.workflow_run.triggering_actor.login == github.repository_owner && startsWith(github.event.workflow_run.head_commit.message, 'Публикуй: '))
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    outputs:
      operation: ${{ steps.authorization.outputs.operation }}
      version: ${{ steps.guard.outputs.version }}
      build: ${{ steps.guard.outputs.build }}
      rollback: ${{ steps.guard.outputs.rollback }}
      run_id: ${{ steps.run.outputs.run_id }}
    steps:
      - name: Авторизованная команда
        id: authorization
        env:
          COMMAND: ${{ github.event_name == 'workflow_run' && 'Публикуй' || (github.event_name == 'issues' && (startsWith(github.event.issue.title, 'Публикуй: ') && 'Публикуй' || 'Проверь')) || inputs.operation }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.actor.login || github.actor }}
          TRIGGER: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.triggering_actor.login || github.triggering_actor }}
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_SENDER: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = issues ]; then
            [ "$GITHUB_RUN_ATTEMPT" = 1 ] &&
            [ "$ISSUE_AUTHOR" = "$OWNER" ] &&
            [ "$ISSUE_SENDER" = "$OWNER" ] &&
            [ "$ACTOR" = "$OWNER" ] &&
            [ "$TRIGGER" = "$OWNER" ] &&
            [ "$ISSUE_BODY" = 'Release Guard owner command v1' ] &&
            [ "$ISSUE_TITLE" = "$COMMAND: $GITHUB_SHA" ] &&
            [ "$GITHUB_REF" = refs/heads/main ] ||
              { echo 'ЗАБЛОКИРОВАНО: неверная команда, автор или SHA'; exit 1; }
            EXPECTED_SHA=$GITHUB_SHA
          fi
          [ -z "$EXPECTED_SHA" ] || [ "$EXPECTED_SHA" = "$GITHUB_SHA" ] ||
            { echo 'ЗАБЛОКИРОВАНО: ветка изменилась после команды владельца'; exit 1; }
          if [ "$COMMAND" = 'Публикуй' ] || [ "$COMMAND" = 'Восстанови' ]; then
            [ "$GITHUB_REF" = refs/heads/main ] && [ "$ACTOR" = "$OWNER" ] && [ "$TRIGGER" = "$OWNER" ] ||
              { echo 'ЗАБЛОКИРОВАНО: выпуск и восстановление доступны владельцу из main'; exit 1; }
          fi
          echo "operation=$COMMAND" >> "$GITHUB_OUTPUT"
          echo "ПОДГОТОВКА $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - if: steps.authorization.outputs.operation == 'Проверь' && github.ref_name == 'main'
        name: Проверить рабочий сайт
        run: node tools/release-guard.cjs diagnose | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Найти обязательный прогон точного коммита
        if: steps.authorization.outputs.operation != 'Проверь' || github.ref_name != 'main'
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND: ${{ github.event_name == 'workflow_run' && 'Публикуй' || (github.event_name == 'issues' && (startsWith(github.event.issue.title, 'Публикуй: ') && 'Публикуй' || 'Проверь')) || inputs.operation }}
        run: |
          set -eu
          target=$GITHUB_SHA
          if [ "$COMMAND" = 'Публикуй' ] || [ "$COMMAND" = 'Восстанови' ]; then
            [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA" ] ||
              { echo 'ЗАБЛОКИРОВАНО: main изменился'; exit 1; }
            [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)" = workflow ] ||
              { echo 'ЗАБЛОКИРОВАНО: источник Pages должен быть GitHub Actions'; exit 1; }
          fi
          if [ "$COMMAND" = 'Восстанови' ]; then target=$(node tools/release-guard.cjs live-sha); fi
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs" \
            -f head_sha="$target" -f branch="$GITHUB_REF_NAME" -F per_page=30 > /tmp/quality-runs.json
          jq --arg ref "$GITHUB_REF_NAME" --arg command "$COMMAND" '[.workflow_runs[] |
            select(.event=="workflow_dispatch" or (.event=="push" and $ref=="main") or (.event=="pull_request" and $command=="Проверь"))]' /tmp/quality-runs.json > /tmp/eligible.json
          if [ "$COMMAND" = 'Восстанови' ]; then
            for run in $(jq -r '.[]|select(.conclusion=="success").id' /tmp/eligible.json); do
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?name=release-packages" --jq '.artifacts[]|select(.expired==false).id' | grep -q '[0-9]'; then
                jq --argjson run "$run" '.[]|select(.id==$run)' /tmp/eligible.json > /tmp/quality-run.json
                break
              fi
            done
          else
            jq '.[0] | select(.status=="completed" and .conclusion=="success")' /tmp/eligible.json > /tmp/quality-run.json
          fi
          [ -s /tmp/quality-run.json ] ||
            { echo 'ЗАБЛОКИРОВАНО: последний обязательный прогон этого SHA отсутствует или не завершился успешно'; exit 1; }
          run_id=$(jq -er .id /tmp/quality-run.json)
          attempt=$(jq -er .run_attempt /tmp/quality-run.json)
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$attempt/jobs?per_page=100" \
            --jq '.jobs' | jq -s 'add' > /tmp/quality-jobs.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.run.outputs.run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.run.outputs.run_id }}
          name: release-packages
          path: /tmp/release
      - name: Контроль SHA, архива и текущего сайта
        if: steps.run.outputs.run_id != ''
        id: guard
        env:
          COMMAND: ${{ github.event_name == 'workflow_run' && 'Публикуй' || (github.event_name == 'issues' && (startsWith(github.event.issue.title, 'Публикуй: ') && 'Публикуй' || 'Проверь')) || inputs.operation }}
          TARGET: ${{ steps.run.outputs.target }}
        run: |
          node tools/release-guard.cjs select /tmp/release /tmp/quality-run.json /tmp/quality-jobs.json "$TARGET" "$GITHUB_REPOSITORY" "$COMMAND" | tee -a "$GITHUB_STEP_SUMMARY"
  publish:
    if: needs.preflight.outputs.operation == 'Публикуй'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.preflight.outputs.run_id }}
          name: release-packages
          path: /tmp/release
      - name: Публикация проверенного архива
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA" ] ||
            { echo 'ЗАБЛОКИРОВАНО: main изменился при подготовке'; exit 1; }
          node tools/release-guard.cjs recheck /tmp/release candidate
          mkdir /tmp/deploy
          mv /tmp/release/candidate.tar /tmp/deploy/artifact.tar
          echo "ПУБЛИКАЦИЯ $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: /tmp/deploy/artifact.tar
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Дождаться регистрации точного архива Pages
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          for delay in 0 2 4 8 12 16 20; do
            sleep "$delay"
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" --jq '.artifacts' > /tmp/pages-artifacts.json &&
               jq -e --arg id "$ARTIFACT_ID" --arg name "$ARTIFACT_NAME" 'length == 1 and (.[0] | (.id|tostring)==$id and .name==$name and .expired==false and .size_in_bytes>0)' /tmp/pages-artifacts.json >/dev/null; then
              echo "Архив Pages зарегистрирован: $ARTIFACT_ID"
              exit 0
            fi
            echo 'Ожидание регистрации архива Pages'
          done
          echo 'ЗАБЛОКИРОВАНО: точный архив не зарегистрирован в пределах 62 секунд'
          exit 1
      - name: Финальный контроль main перед передачей в Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA" ] ||
            { echo 'ЗАБЛОКИРОВАНО: main изменился перед развёртыванием'; exit 1; }
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
  verify:
    needs: [preflight, publish]
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    timeout-minutes: 5
    outputs:
      critical: ${{ steps.integrity.outputs.critical || steps.smoke.outputs.critical }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.preflight.outputs.run_id }}
          name: release-packages
          path: /tmp/release
      - name: Доступность версии и хэшей ресурсов
        id: integrity
        run: node tools/release-guard.cjs published /tmp/release candidate
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: playwright-npm-1.65.1-${{ runner.os }}
      - run: npm install --no-save --package-lock=false --prefer-offline --no-audit --no-fund playwright@1.65.1
      - name: Реальная навигация на опубликованной сборке
        id: smoke
        env:
          BROWSER: chromium
          LIVE_RELEASE_ONLY: '1'
          EXPECTED_LIVE_RELEASE: ${{ needs.preflight.outputs.version }}
        run: |
          if timeout --kill-after=5s 50s node tests/live-navigation.cjs ||
             timeout --kill-after=5s 50s node tests/live-navigation.cjs; then
            echo "ОПУБЛИКОВАНО НА СЕРВЕРЕ $EXPECTED_LIVE_RELEASE $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
            echo 'ОБНОВЛЕНИЕ НА iPad: требуется подтверждение из установленного приложения.' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            node tools/release-guard.cjs recheck /tmp/release stable
            echo 'critical=true' >> "$GITHUB_OUTPUT"
            echo 'ЗАБЛОКИРОВАНО: подтверждённая сборка дважды не прошла проверку браузером'
            exit 1
          fi
  restore:
    if: always() && needs.preflight.result == 'success' && needs.preflight.outputs.rollback == 'true' && (inputs.operation == 'Восстанови' || needs.verify.outputs.critical == 'true')
    needs: [preflight, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.preflight.outputs.run_id }}
          name: release-packages
          path: /tmp/release
      - name: Проверить неизменность сайта и совместимый архив
        run: |
          node tools/release-guard.cjs recheck /tmp/release stable
          mkdir /tmp/recovery
          mv /tmp/release/stable.tar /tmp/recovery/artifact.tar
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-rollback-${{ github.run_attempt }}
          path: /tmp/recovery/artifact.tar
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Дождаться регистрации точного архива Pages
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_NAME: github-pages-rollback-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          for delay in 0 2 4 8 12 16 20; do
            sleep "$delay"
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" --jq '.artifacts' > /tmp/pages-artifacts.json &&
               jq -e --arg id "$ARTIFACT_ID" --arg name "$ARTIFACT_NAME" 'length == 1 and (.[0] | (.id|tostring)==$id and .name==$name and .expired==false and .size_in_bytes>0)' /tmp/pages-artifacts.json >/dev/null; then
              echo "Архив Pages зарегистрирован: $ARTIFACT_ID"
              exit 0
            fi
            echo 'Ожидание регистрации архива Pages'
          done
          echo 'ЗАБЛОКИРОВАНО: точный архив не зарегистрирован в пределах 62 секунд'
          exit 1
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-rollback-${{ github.run_attempt }}
      - run: |
          node tools/release-guard.cjs published /tmp/release stable
          echo 'ВОССТАНОВЛЕНО НА СЕРВЕРЕ: точный стабильный архив снова доступен' | tee -a "$GITHUB_STEP_SUMMARY"
  report:
    if: always() && needs.preflight.result != 'skipped'
    needs: [preflight, publish, verify, restore]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          COMMAND: ${{ github.event_name == 'workflow_run' && 'Публикуй' || (github.event_name == 'issues' && (startsWith(github.event.issue.title, 'Публикуй: ') && 'Публикуй' || 'Проверь')) || inputs.operation }}
          PREPARE: ${{ needs.preflight.result }}
          VERIFY: ${{ needs.verify.result }}
          RESTORE: ${{ needs.restore.result }}
        run: |
          if [ "$RESTORE" = success ]; then
            echo 'ВОССТАНОВЛЕНО НА СЕРВЕРЕ. ОБНОВЛЕНИЕ НА iPad ОЖИДАЕТ ПОДТВЕРЖДЕНИЯ.' | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$VERIFY" = success ]; then
            echo 'ОПУБЛИКОВАНО НА СЕРВЕРЕ. ОБНОВЛЕНИЕ НА iPad ОЖИДАЕТ ПОДТВЕРЖДЕНИЯ.' | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$PREPARE" = success ] && [ "$COMMAND" = 'Проверь' ]; then
            echo 'ПРОВЕРЕНО. ДЕЙСТВУЮЩАЯ СБОРКА СОХРАНЕНА.' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'ЗАБЛОКИРОВАНО: смотрите завершившийся с ошибкой этап. Автоматический откат требует совместимой проверенной сборки.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
