name: Quality checks
on:
  push:
    branches: [main, pdf-reference-1.5.50]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node tests/regression.cjs
  browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --package-lock=false playwright@1.65.1
      - run: node tests/browser-smoke.cjs
        env:
          BROWSER: ${{ matrix.browser }}
  legacy-upgrade:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: npm install --no-save --package-lock=false playwright@1.65.1
      - name: Exact published 1.5.208 upgrade (synthetic data only)
        timeout-minutes: 4
        run: node tests/release-207-to-208.cjs
        env:
          BROWSER: ${{ matrix.browser }}
          QA_BASE_SHA: 3f24ecb06db8adc678fbbc2d91d1107e00bdca21
          QA_BASE_VERSION: '1.5.208'
          QA_TARGET_VERSION: '1.5.209'
  release-ready:
    needs: [regression, browser, legacy-upgrade]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "Regression, full browser checks and exact legacy upgrade passed. Visual, device and backup acceptance remain separate release gates."
