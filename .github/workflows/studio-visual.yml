name: Studio screen comparison
on:
  pull_request:
    paths:
      - index.html
      - studio-layout.css
      - watercolor-home-199.css
      - studio-drawings.js
      - studio-friends.js
      - 'assets/author/**'
      - tests/studio-visual.cjs
      - .github/workflows/studio-visual.yml
permissions:
  contents: read
jobs:
  screens:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - run: npm install --no-save --package-lock=false playwright@1.65.1
      - name: Capture before and after
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python3 -m http.server 8581 --bind 127.0.0.1 --directory baseline >/tmp/base.log 2>&1 &
          python3 -m http.server 8582 --bind 127.0.0.1 >/tmp/candidate.log 2>&1 &
          # Avoid Chromium/WebKit races: both HTTP servers must answer before capture.
          python3 - <<'PY'
          import time
          import urllib.request
          for port in (8581, 8582):
              url = f'http://127.0.0.1:{port}/'
              for attempt in range(50):
                  try:
                      with urllib.request.urlopen(url, timeout=1) as response:
                          if response.status == 200:
                              break
                  except (OSError, ValueError):
                      pass
                  time.sleep(0.2)
              else:
                  raise SystemExit(f'HTTP server at {url} did not become ready')
          PY
          node tests/studio-visual.cjs http://127.0.0.1:8581 screens/before
          node tests/studio-visual.cjs http://127.0.0.1:8582 screens/after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-${{ matrix.browser }}
          path: screens
